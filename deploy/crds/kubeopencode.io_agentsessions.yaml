---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agentsessions.kubeopencode.io
spec:
  group: kubeopencode.io
  names:
    kind: AgentSession
    listKind: AgentSessionList
    plural: agentsessions
    shortNames:
    - ags
    singular: agentsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef.name
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .status.engine
      name: Engine
      type: string
    - jsonPath: .status.pid
      name: PID
      priority: 1
      type: integer
    - jsonPath: .status.restartCount
      name: Restarts
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentSession manages a long-running, supervised interactive agent
          session on an Agent pod.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSessionSpec defines the desired state of an AgentSession.
            properties:
              agentRef:
                description: |-
                  AgentRef specifies the target Agent running the session supervisor.
                  Required.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
              crashWindowSecs:
                description: CrashWindowSecs specifies the crash-threshold window
                  in seconds.
                format: int32
                type: integer
              engine:
                allOf:
                - enum:
                  - opencode
                  - agy
                  - claude
                - enum:
                  - opencode
                  - agy
                  - claude
                description: |-
                  Engine specifies the execution engine (claude, agy, opencode).
                  If omitted, defaults to the Agent's default engine.
                type: string
              failedCooldownSecs:
                description: FailedCooldownSecs specifies how long a failed session
                  stays failed before retrying.
                format: int32
                type: integer
              hangTimeoutSecs:
                description: HangTimeoutSecs specifies silent-PTY seconds before kill+restart
                  (0 = disabled).
                format: int32
                type: integer
              instructionsFile:
                description: InstructionsFile specifies the absolute path of this
                  session's instruction file.
                type: string
              killGraceSecs:
                description: KillGraceSecs specifies SIGTERM to SIGKILL grace period
                  in seconds.
                format: int32
                type: integer
              maxCrashes:
                description: MaxCrashes specifies crashes within crash_window_secs
                  before marking session failed.
                format: int32
                type: integer
              readinessPollSecs:
                description: ReadinessPollSecs specifies auth-readiness check interval
                  in seconds.
                format: int32
                type: integer
              sandbox:
                description: Sandbox indicates whether the session runs under sandbox
                  containment. Default true.
                type: boolean
              suspended:
                description: Suspended pauses or stops the session.
                type: boolean
            required:
            - agentRef
            type: object
          status:
            description: AgentSessionStatus defines the observed state of an AgentSession.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the session's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controlled:
                description: Controlled indicates whether remote control daemon is
                  actively attached.
                type: boolean
              engine:
                description: Engine reported by the worker daemon.
                type: string
              engineReady:
                description: EngineReady is reported for server-backed engines requiring
                  warm-up.
                type: boolean
              lastExitReason:
                description: LastExitReason describes the exit code or signal from
                  the last termination.
                type: string
              lastHealthResult:
                description: LastHealthResult describes the outcome of the latest
                  readiness/health check.
                type: string
              paused:
                description: Paused indicates if the session is currently paused.
                type: boolean
              phase:
                description: Phase is the high-level lifecycle status of the session.
                enum:
                - Pending
                - Running
                - Stopped
                - Failed
                type: string
              pid:
                description: PID is the operating system process ID on the agent container.
                type: integer
              restartCount:
                description: RestartCount is how many times the process has been restarted
                  by the supervisor.
                type: integer
              startTime:
                description: StartTime is RFC3339 timestamp when the session started.
                format: date-time
                type: string
              uptimeSecs:
                description: UptimeSecs is the elapsed seconds the session has been
                  continuously running.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
