---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: kubeopencodeconfigs.kubeopencode.io
spec:
  group: kubeopencode.io
  names:
    kind: KubeOpenCodeConfig
    listKind: KubeOpenCodeConfigList
    plural: kubeopencodeconfigs
    shortNames:
    - ktc
    singular: kubeopencodeconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubeOpenCodeConfig defines system-level configuration for KubeOpenCode.
          This CRD provides cluster-wide settings for the KubeOpenCode system.
          It is a cluster-scoped singleton resource that must be named "cluster".
          Following the OpenShift convention for cluster-wide configuration resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the KubeOpenCode configuration
            properties:
              cleanup:
                description: |-
                  Cleanup configures automatic cleanup of completed Tasks.
                  When configured, completed/failed Tasks are automatically deleted based on
                  TTL (time-to-live) and/or retention count policies.
                  If not specified, Tasks are not automatically deleted (default behavior).
                properties:
                  maxRetainedTasks:
                    description: |-
                      MaxRetainedTasks specifies the maximum number of completed/failed Tasks to retain
                      per namespace. When exceeded, the oldest Tasks (by CompletionTime) are deleted first.
                      If unset or nil, retention-based cleanup is disabled.

                      Note: This is a cluster-wide configuration that applies the same limit to each namespace.
                      TTL cleanup takes precedence - Tasks exceeding TTL are deleted regardless of this limit.
                      This count only applies to Tasks that haven't exceeded TTL yet.

                      Example:
                        maxRetainedTasks: 100  # Keep at most 100 completed Tasks per namespace
                    format: int32
                    minimum: 0
                    type: integer
                  ttlSecondsAfterFinished:
                    description: |-
                      TTLSecondsAfterFinished specifies the TTL for cleaning up finished Tasks.
                      If set, completed/failed Tasks will be deleted after this duration from CompletionTime.
                      If unset or nil, TTL-based cleanup is disabled.

                      Example:
                        ttlSecondsAfterFinished: 3600  # Delete after 1 hour
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              clusterDomain:
                description: |-
                  ClusterDomain specifies the cluster domain name (e.g., "cluster.local").
                  This is used for constructing in-cluster service URLs.
                  If not specified, "cluster.local" is used as the default.
                maxLength: 253
                pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                type: string
              observability:
                description: |-
                  Observability configures OpenTelemetry telemetry for OpenCode agent Pods.
                  When enabled, the controller injects OTLP environment variables into Pod specs
                  so that OpenCode's built-in OTel support is activated automatically.
                  If not specified, no telemetry is produced.
                properties:
                  openTelemetry:
                    description: |-
                      OpenTelemetry configures OpenTelemetry telemetry integration.
                      When enabled, the controller injects OTLP environment variables into agent Pods
                      so that OpenCode's built-in OTel support is activated automatically.
                    properties:
                      enableLLMTraces:
                        description: |-
                          EnableLLMTraces injects experimental.openTelemetry into OpenCode config
                          to enable LLM call traces with GenAI semantic conventions.
                          When true, every LLM call produces spans with model, token counts, and latency
                          that nest within the application-level turn spans (Layer 3).
                          Requires endpoint to be set (Layer 1 must be active for Layer 2 to work).
                        type: boolean
                      enabled:
                        description: |-
                          Enabled determines whether OpenTelemetry telemetry is produced.
                          When true, the controller injects OTEL_EXPORTER_OTLP_ENDPOINT and related
                          environment variables into agent Pod specs.
                        type: boolean
                      endpoint:
                        description: |-
                          Endpoint is the OTLP/HTTP endpoint for the user's OpenTelemetry Collector.
                          This is the user's existing observability infrastructure —
                          KubeOpenCode does NOT deploy or manage Collectors.
                          Required when enabled is true.
                          Examples:
                            - Gateway mode:  http://otel-collector.observability:4318
                            - Sidecar mode:  http://localhost:4318
                            - External SaaS: https://api.honeycomb.io

                          Note: OpenCode uses OTLP/HTTP (port 4318), not gRPC (port 4317).
                          The configured endpoint MUST point to an OTLP/HTTP receiver.
                        pattern: ^https?://.+$
                        type: string
                      headers:
                        additionalProperties:
                          description: |-
                            OTelHeaderValueSource represents a header value that can be specified inline
                            or resolved from a Kubernetes Secret.
                          properties:
                            value:
                              description: |-
                                Value specifies the header value inline.
                                Use for non-sensitive values. For sensitive values (API keys), use valueFrom.secretKeyRef.
                              type: string
                            valueFrom:
                              description: |-
                                ValueFrom specifies the source for the header value.
                                Use this for sensitive values like SaaS API keys to avoid leaking them in the KubeOpenCodeConfig.
                              properties:
                                secretKeyRef:
                                  description: |-
                                    SecretKeyRef references a key in a Secret containing the header value.
                                    The Secret must be in the same namespace as the KubeOpenCodeConfig controller
                                    (kubeopencode-system by default).
                                  properties:
                                    key:
                                      description: The key of the secret to select
                                        from.  Must be a valid secret key.
                                      type: string
                                    name:
                                      default: ""
                                      description: |-
                                        Name of the referent.
                                        This field is effectively required, but due to backwards compatibility is
                                        allowed to be empty. Instances of this type with an empty value here are
                                        almost certainly wrong.
                                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                      type: string
                                    optional:
                                      description: Specify whether the Secret or its
                                        key must be defined
                                      type: boolean
                                  required:
                                  - key
                                  type: object
                                  x-kubernetes-map-type: atomic
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: either a non-empty value or valueFrom.secretKeyRef
                              must be specified
                            rule: (has(self.value) && size(self.value) > 0) || (has(self.valueFrom)
                              && has(self.valueFrom.secretKeyRef))
                        description: |-
                          Headers specifies optional headers for collector authentication (e.g., SaaS API keys).
                          Values can be inline or resolved from a Secret via valueFrom.secretKeyRef
                          to avoid leaking API keys in the KubeOpenCodeConfig.
                        type: object
                      recordContent:
                        description: |-
                          RecordContent determines whether to record full prompt/response content on LLM spans.
                          Default false; set true only in trusted environments.
                          When true, the controller injects OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true
                          per OTel GenAI spec. This may expose sensitive data (API keys, PII, proprietary code).
                        type: boolean
                      resourceAttributes:
                        additionalProperties:
                          type: string
                        description: |-
                          ResourceAttributes specifies additional resource attributes to add to all spans.
                          The controller also automatically injects standard attributes:
                          kubeopencode.task.name, kubeopencode.task.namespace, kubeopencode.agent.name,
                          k8s.namespace.name, k8s.pod.name.
                        type: object
                    required:
                    - enabled
                    type: object
                    x-kubernetes-validations:
                    - message: endpoint is required when enabled is true
                      rule: '!self.enabled || size(self.endpoint) > 0'
                type: object
              proxy:
                description: |-
                  Proxy configures cluster-wide HTTP/HTTPS proxy settings for all generated Pods.
                  Agent-level proxy settings take precedence over cluster-level settings.
                  If not specified, no proxy environment variables are injected.
                properties:
                  httpProxy:
                    description: |-
                      HttpProxy is the URL of the HTTP proxy server.
                      Sets HTTP_PROXY and http_proxy environment variables.
                      Example: "http://proxy.corp.example.com:8080"
                    type: string
                  httpsProxy:
                    description: |-
                      HttpsProxy is the URL of the HTTPS proxy server.
                      Sets HTTPS_PROXY and https_proxy environment variables.
                      Example: "http://proxy.corp.example.com:8080"
                    type: string
                  noProxy:
                    description: |-
                      NoProxy is a comma-separated list of hosts that should bypass the proxy.
                      Sets NO_PROXY and no_proxy environment variables.
                      ".svc" and ".cluster.local" are always appended automatically.
                      Example: "localhost,127.0.0.1,10.0.0.0/8,.corp.example.com"
                    type: string
                type: object
              systemImage:
                description: |-
                  SystemImage configures the KubeOpenCode system image used for internal components
                  such as git-init and context-init containers.
                  If not specified, uses the built-in default image with IfNotPresent policy.
                properties:
                  image:
                    description: |-
                      Image specifies the system image to use for internal KubeOpenCode components.
                      If not specified, defaults to the built-in DefaultKubeOpenCodeImage.
                      Example: "ghcr.io/kubeopencode/kubeopencode:v0.2.0"
                    type: string
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy specifies the image pull policy for the system image.
                      Defaults to IfNotPresent if not specified.
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                    type: string
                type: object
              taskDefaults:
                description: TaskDefaults provides cluster-wide default settings for
                  task execution.
                properties:
                  effort:
                    description: Effort default for tasks.
                    type: string
                  hindsight:
                    description: Hindsight default for tasks.
                    properties:
                      bank:
                        description: Bank specifies the memory bank id to use.
                        type: string
                      enabled:
                        description: Enabled toggles Hindsight memory for this task
                          run.
                        type: boolean
                      query:
                        description: Query specifies a custom query to prime Hindsight
                          context.
                        type: string
                    type: object
                  model:
                    description: Model default for tasks.
                    type: string
                  proxy:
                    description: Proxy default for tasks.
                    type: string
                  sandbox:
                    description: Sandbox default for tasks.
                    type: boolean
                type: object
              workerDefaults:
                description: |-
                  WorkerDefaults provides cluster-wide default settings for kubeadp-agent workers.
                  Merged into Agent/Template worker settings as the base layer.
                properties:
                  a2a:
                    description: A2A defines Agent-to-Agent protocol configuration.
                    properties:
                      ackSecs:
                        description: |-
                          AckSecs specifies escalation ladder ack window in seconds.
                          Maps to [worker] a2a_ack_secs / AGENT_RUN_A2A_ACK_SECS.
                        format: int32
                        minimum: 0
                        type: integer
                      echo:
                        description: |-
                          Echo specifies user-visible A2A echo in transcripts.
                          Maps to [worker] a2a_echo / AGENT_RUN_A2A_ECHO.
                        type: boolean
                      enabled:
                        description: |-
                          Enabled enables or disables A2A messaging.
                          Maps to [worker] a2a_mcp_enabled / AGENT_RUN_A2A_MCP_ENABLED (when false, disables tools).
                        type: boolean
                      forceSecs:
                        description: |-
                          ForceSecs specifies escalation ladder force timeout (0 = never kill).
                          Maps to [worker] a2a_force_secs / AGENT_RUN_A2A_FORCE_SECS.
                        format: int32
                        minimum: 0
                        type: integer
                      inboxTtlSecs:
                        description: |-
                          InboxTTLDurationSecs specifies inbox message TTL in seconds (min 10).
                          Maps to [worker] a2a_inbox_ttl_secs / AGENT_RUN_A2A_INBOX_TTL_SECS.
                        format: int32
                        minimum: 10
                        type: integer
                      interruptMinSecs:
                        description: |-
                          InterruptMinSecs specifies minimum seconds between interrupt steps on one job.
                          Maps to [worker] a2a_interrupt_min_secs / AGENT_RUN_A2A_INTERRUPT_MIN_SECS.
                        format: int32
                        minimum: 0
                        type: integer
                      liveIdleSecs:
                        description: |-
                          LiveIdleSecs specifies idle seconds before live channel close (0 or >= 10).
                          Maps to [worker] a2a_live_idle_secs / AGENT_RUN_A2A_LIVE_IDLE_SECS.
                        format: int32
                        minimum: 0
                        type: integer
                      liveStdin:
                        description: |-
                          LiveStdin specifies whether live stdin transport is enabled for idle turn channel.
                          Maps to [worker] a2a_live_stdin / AGENT_RUN_A2A_LIVE_STDIN.
                        type: boolean
                      mcpEnabled:
                        description: |-
                          MCPEnabled specifies whether agent A2A MCP tools are enabled.
                          Maps to [worker] a2a_mcp_enabled / AGENT_RUN_A2A_MCP_ENABLED.
                        type: boolean
                    type: object
                  defaultBaseBranch:
                    description: |-
                      DefaultBaseBranch specifies default base branch for git worktrees.
                      Maps to [worker] default_base_branch / AGENT_RUN_DEFAULT_BASE_BRANCH.
                    type: string
                  defaultEffort:
                    description: |-
                      DefaultEffort specifies default reasoning effort.
                      Maps to [worker] default_effort / AGENT_RUN_DEFAULT_EFFORT.
                    type: string
                  defaultEngine:
                    allOf:
                    - enum:
                      - opencode
                      - agy
                      - claude
                    - enum:
                      - opencode
                      - agy
                      - claude
                    description: |-
                      DefaultEngine specifies default engine.
                      Maps to [worker] default_engine / AGENT_RUN_DEFAULT_ENGINE.
                    type: string
                  defaultModel:
                    description: |-
                      DefaultModel specifies default model name passed to jobs.
                      Maps to [worker] default_model / AGENT_RUN_DEFAULT_MODEL.
                    type: string
                  gcMaxAgeDays:
                    description: |-
                      GCMaxAgeDays specifies maximum age in days before completed jobs are garbage collected.
                      Maps to [worker] gc_max_age_days / AGENT_RUN_GC_MAX_AGE_DAYS.
                    format: int32
                    minimum: 1
                    type: integer
                  hindsight:
                    description: Hindsight defines Hindsight memory configuration.
                    properties:
                      apiKeySecretRef:
                        description: |-
                          APIKeySecretRef references a Secret containing the Hindsight API key.
                          Injected as AGENT_RUN_HINDSIGHT_API_KEY environment variable.
                          Inline secrets are rejected.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      autoRecall:
                        description: |-
                          AutoRecall specifies whether Hindsight context should automatically be recalled.
                          Maps to [worker] hindsight_auto_recall / AGENT_RUN_HINDSIGHT_AUTO_RECALL.
                        type: boolean
                      autoRetain:
                        description: |-
                          AutoRetain specifies whether Hindsight memory should automatically retain learnings.
                          Maps to [worker] hindsight_auto_retain / AGENT_RUN_HINDSIGHT_AUTO_RETAIN.
                        type: boolean
                      bank:
                        description: |-
                          Bank specifies the Hindsight memory bank id.
                          Maps to [worker] hindsight_bank / AGENT_RUN_HINDSIGHT_BANK.
                        type: string
                      enabled:
                        description: |-
                          Enabled enables or disables Hindsight memory.
                          Maps to [worker] hindsight_enabled / AGENT_RUN_HINDSIGHT_ENABLED.
                        type: boolean
                      profile:
                        description: |-
                          Profile specifies the Hindsight profile name.
                          Maps to [worker] hindsight_profile / AGENT_RUN_HINDSIGHT_PROFILE.
                        type: string
                      tag:
                        description: |-
                          Tag specifies the project tag.
                          Maps to [worker] hindsight_tag / AGENT_RUN_HINDSIGHT_TAG.
                        type: string
                      url:
                        description: |-
                          URL specifies the remote Hindsight API base URL.
                          Maps to [worker] hindsight_url / AGENT_RUN_HINDSIGHT_URL.
                        type: string
                    type: object
                  jobsDirName:
                    description: |-
                      JobsDirName specifies directory name for job worktrees under workspace root.
                      Maps to [worker] jobs_dir_name / AGENT_RUN_JOBS_DIR_NAME.
                    type: string
                  launchTimeoutSecs:
                    description: |-
                      LaunchTimeoutSecs specifies timeout in seconds for agent process launch.
                      Maps to [worker] launch_timeout_secs / AGENT_RUN_LAUNCH_TIMEOUT_SECS.
                    format: int32
                    minimum: 1
                    type: integer
                  maxParallel:
                    description: |-
                      MaxParallel limits concurrent jobs on this worker.
                      Maps to [worker] max_parallel / AGENT_RUN_MAX_PARALLEL.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  maxRuntime:
                    description: |-
                      MaxRuntime specifies maximum execution duration string for jobs (e.g. "2h", "30m").
                      Maps to [worker] max_runtime / AGENT_RUN_MAX_RUNTIME.
                    type: string
                  proxy:
                    description: Proxy defines HTTP/HTTPS/NO_PROXY settings.
                    properties:
                      http:
                        description: |-
                          HTTP proxy URL.
                          Maps to [common] http_proxy / AGENT_RUN_HTTP_PROXY.
                        properties:
                          secretKeyRef:
                            description: SecretKeyRef selects a key of a Secret in
                              the resource's namespace.
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                          value:
                            description: Value specified directly.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value or secretKeyRef must be specified
                          rule: has(self.value) != has(self.secretKeyRef)
                      https:
                        description: |-
                          HTTPS proxy URL.
                          Maps to [common] https_proxy / AGENT_RUN_HTTPS_PROXY.
                        properties:
                          secretKeyRef:
                            description: SecretKeyRef selects a key of a Secret in
                              the resource's namespace.
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                          value:
                            description: Value specified directly.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value or secretKeyRef must be specified
                          rule: has(self.value) != has(self.secretKeyRef)
                      noProxy:
                        description: |-
                          NoProxy specifies comma-separated hosts to bypass proxy.
                          Maps to [common] no_proxy / AGENT_RUN_NO_PROXY.
                        properties:
                          secretKeyRef:
                            description: SecretKeyRef selects a key of a Secret in
                              the resource's namespace.
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                          value:
                            description: Value specified directly.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value or secretKeyRef must be specified
                          rule: has(self.value) != has(self.secretKeyRef)
                    type: object
                  remoteControl:
                    description: RemoteControl defines remote control daemon settings.
                    properties:
                      autostart:
                        description: |-
                          Autostart automatically starts the remote control daemon when the worker starts.
                          Maps to [worker] remote_control_autostart / AGENT_RUN_REMOTE_CONTROL_AUTOSTART.
                        type: boolean
                      checkSecs:
                        description: |-
                          CheckSecs specifies check interval in seconds (minimum 10).
                          Maps to [worker] remote_control_check_secs / AGENT_RUN_REMOTE_CONTROL_CHECK_SECS.
                        format: int32
                        minimum: 10
                        type: integer
                      enabled:
                        description: |-
                          Enabled enables or disables remote control.
                          Maps to [worker] remote_control / AGENT_RUN_REMOTE_CONTROL.
                        type: boolean
                    type: object
                  reposRoot:
                    description: |-
                      ReposRoot specifies path to bare repository cache.
                      Maps to [worker] repos_root / AGENT_RUN_REPOS_ROOT.
                    type: string
                  sandbox:
                    description: Sandbox defines sandbox read-only paths and allowed
                      environment variables.
                    properties:
                      envAllow:
                        description: EnvAllow specifies environment variable names
                          allowed into the sandbox.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      roPaths:
                        description: |-
                          ROPaths specifies absolute paths appended to the read-only list of every sandbox policy.
                          Must be absolute paths without '..' directory traversal.
                          Maps to [common] sandbox_ro_paths / KUBEADP_SANDBOX_RO_PATHS.
                        items:
                          maxLength: 4096
                          type: string
                        maxItems: 100
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: roPaths entries must be absolute paths without
                            ..
                          rule: self.all(p, p.startsWith('/') && !p.contains('..'))
                    type: object
                  shutdownGraceSecs:
                    description: |-
                      ShutdownGraceSecs specifies graceful shutdown period in seconds for job processes.
                      Maps to [worker] shutdown_grace_secs / AGENT_RUN_SHUTDOWN_GRACE.
                    format: int32
                    minimum: 1
                    type: integer
                  stallMinutes:
                    description: |-
                      StallMinutes specifies inactivity timeout in minutes before a job is flagged stalled.
                      Maps to [worker] stall_minutes / AGENT_RUN_STALL_MINUTES.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: KubeOpenCodeConfig must be named 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources: {}
