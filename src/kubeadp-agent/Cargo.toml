[package]
name = "kubeadp-agent"
version = "0.1.0"
edition = "2021"
description = "One package for the agy AI coding agent stack: core job-execution engine, the agent orchestrator (process supervisor + REST API) and the agent-run worker/CLI (job execution API daemon and remote CLI client). Consolidates the former agent-core, agent-orchestrate, agent-run-api and agent-run-cli crates."

[lib]
name = "kubeadp_agent"
path = "src/lib.rs"

[features]
default = ["cli", "server", "engine"]
# The axum-based HTTP stack shared by the core server module (`core::server`),
# the orchestrator (supervisor HTTP API) and the worker (agent-run API daemon).
server = [
    "engine",
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:serde_urlencoded",
    "dep:tower",
    "dep:http-body-util",
    "dep:uuid",
]
# The agent-run remote CLI client (`cli` module, ureq).
cli = ["engine", "dep:ureq"]
# A2A v1 agent protocol surface (agent card + JSON-RPC/REST bindings).
# Merges the three old `a2a` features (agent-core/a2a, agent-orchestrate/a2a,
# agent-run-api/a2a). Depends on `server` for the shared axum stack.
# The `mcp-a2a` subcommand (A2A sending side over MCP) lives on the same
# feature: it reuses the official A2A client SDK plus rmcp for the stdio MCP
# transport, so none of that dependency tree reaches non-a2a builds. Implies
# `engine`: the A2A injection framework (design HL-113 §7.14) is defined
# against the engine capability vocabulary (`a2a.inject`, the per-engine
# injection channels).
a2a = ["server", "engine", "dep:a2a", "dep:a2a-server-lf", "dep:async-trait", "dep:futures", "dep:a2a-client-lf", "dep:rmcp", "dep:schemars", "dep:reqwest"]
# Test-only hooks used by the supervisor black-box suite (agent-orchestrate).
# Implies `server` (the old agent-orchestrate crate always compiled its HTTP
# stack; the supervisor binary needs it).
test-hooks = ["server"]
# The pluggable engine layer (trait, run model, capability table, registry,
# 501 plumbing -- HL-91 E1). Implies `server`: the engine surface is only
# reached through HTTP endpoints and the trait uses the axum types for its
# 501 mapping. Off by default so the pure `cli` build stays untouched.
engine = ["server", "dep:async-trait"]

[dependencies]
clap = { version = "=4.5.20", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
humantime = "2.1"
dirs = "5.0"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
# Shared SHA-256 / HMAC-SHA256 / constant-time comparison primitives (the
# single crypto provider for the whole crate). Version matches the copy
# already resolved in Cargo.lock via the a2a rustls tree, so declaring it
# directly adds no new package; the feature matrix (cli / server / a2a) all
# reach it, including `--no-default-features --features cli`.
ring = "=0.17.14"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
http-body-util = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v5"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }
a2a = { package = "a2a-lf", version = "=0.4.2", optional = true }
a2a-server-lf = { version = "=0.5.3", default-features = false, optional = true }
# Test-only A2A client used by tests/a2a_client.rs (only in the a2a build).
# Default features pull in rustls so the reqwest client builds; this entire
# dependency tree stays out of non-a2a builds (the a2a feature gates it).
a2a-client-lf = { version = "=0.2.9", default-features = true, optional = true }
# Direct deps needed to implement a2a_server::RequestHandler.
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
# MCP server transport for the `mcp-a2a` subcommand (A2A sending side).
# Pinned to the same rmcp major the sibling info-hub-mcp crate ships, so the
# lock already resolves it; default-features off keeps only the stdio server
# surface (macros + schemars for the tool input schemas).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
schemars = { version = "1.2", default-features = false, features = ["derive"], optional = true }
# Kubernetes discovery + agent-card fetch for the `mcp-a2a` subcommand.
# Version matches a2a-client-lf's, so the lock already resolves it. rustls TLS
# (the same provider a2a-client-lf's default builds use) keeps no native TLS
# in the dependency tree. The `blocking` client is the SANDBOXED A2A inbox
# receive side (`a2a-hook`, `mcp-a2a`): those run as synchronous processes and
# reach their inbox over the pod-local HTTP API.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"], optional = true }

[dev-dependencies]
tempfile = "=3.10.1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"
chrono = { version = "0.4" }
# In-memory MCP client for the a2a-client MCP integration tests; only compiled
# in the a2a+test-hooks CI feature set together with the same-pinned rmcp.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io", "client"] }
# Used only by tests/a2a_client.rs (feature a2a) to fetch the agent card and
# to build the SDK client's reqwest client. Version matches the a2a-client-lf
# dependency so the lock already resolves it.
reqwest = { version = "0.13", default-features = false }

[[bin]]
name = "kubeadp-agent"
path = "src/bin/kubeadp-agent.rs"
required-features = ["server"]

[[bin]]
name = "agent-run"
path = "src/bin/agent-run.rs"
required-features = ["cli"]

